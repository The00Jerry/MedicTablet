<div id="mt-root" class="mt-hidden">
  <div id="mt-toasts"></div>
  <div id="mt-modal" class="mt-modal-overlay mt-hidden"><div class="mt-modal" id="mt-modal-box"></div></div>
  <div id="fp-overlay" class="fp-scan mt-hidden"><div class="fp-box"><div class="fp-ring">☝</div><h2>Fingerabdruck-Scan…</h2><small>Person wird identifiziert</small></div></div>

  <div id="mt-tablet" class="mt-app mt-hidden">
    <aside class="mt-sidebar">
      <div class="mt-brand">
        <img id="mt-logo" src="assets/logo.svg" alt="LSPD"/>
        <div class="mt-brand-text"><span id="mt-dept">Los Santos Police Dept.</span><small id="mt-server">SunLife Roleplay</small></div>
      </div>
      <nav id="mt-nav" class="mt-nav"></nav>
      <div class="mt-user">
        <div class="mt-avatar" id="mt-avatar">O</div>
        <div class="mt-user-info"><span id="mt-username">-</span><small id="mt-userrole">-</small></div>
        <button class="mt-icon-btn" id="mt-close" title="Schließen">&times;</button>
      </div>
    </aside>
    <main class="mt-main">
      <header class="mt-topbar"><h1 id="mt-view-title">Dashboard</h1><div class="mt-top-actions" id="mt-top-actions"></div></header>
      <section id="mt-content" class="mt-content"></section>
    </main>
  </div>
</div>
<script src="app.js"></script>
